<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>GraphQL</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
<div id="toolbar">
  <button id="clear" class="icon-button" title="Clear">
    <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M3.8 3.8l8.4 8.4" stroke="currentColor" stroke-width="1.5"/></svg>
  </button>
  <span class="sep"></span>
  <input id="filter" type="search" placeholder="Filter by name, URL or variables" spellcheck="false" autocomplete="off">
  <label class="check"><input type="checkbox" id="preserve"> Preserve log</label>
  <span id="count"></span>
</div>
<div id="main">
  <div id="list" tabindex="0">
    <table id="table">
      <colgroup>
        <col class="c-name"><col class="c-type"><col class="c-status"><col class="c-size"><col class="c-time"><col class="c-url">
      </colgroup>
      <thead>
        <tr><th>Name</th><th>Type</th><th>Status</th><th>Size</th><th>Time</th><th>URL</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="empty" class="empty">
      <p>Waiting for GraphQL requests…</p>
      <p class="fine-print">Requests made before DevTools was opened are not recorded — reload the page to see them.</p>
    </div>
  </div>
  <div id="gutter"></div>
  <div id="details" hidden>
    <div id="details-tabs">
      <button type="button" class="tab active" data-pane="query">Query</button>
      <button type="button" class="tab" data-pane="response">Response</button>
      <button type="button" class="tab" data-pane="headers">Headers</button>
      <button type="button" id="close" class="icon-button" title="Close">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
    </div>
    <div id="pane-query" class="pane"></div>
    <div id="pane-response" class="pane" hidden></div>
    <div id="pane-headers" class="pane" hidden></div>
  </div>
</div>
<script src="lib/format.js"></script>
<script src="lib/graphql.js"></script>
<script src="lib/json.js"></script>
<script src="lib/fold.js"></script>
<script src="lib/har.js"></script>
<script src="panel.js"></script>
</body>
</html>
